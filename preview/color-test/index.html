<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>색감 비교 테스트</title>
<style>
  /* test page: YouTube (no filter) and the owner's vertical cut, same moment, same framing, side by side */
  html,body{margin:0;background:#000;color:#ccc;font:13px/1.4 -apple-system,system-ui,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:10px 12px 40px}
  h2{font-size:13px;margin:14px 0 6px;color:#fff}
  .pair{display:flex;gap:6px}
  .col{flex:1;min-width:0}
  .lab{font-size:11px;color:#999;margin-top:3px}
  .pane{position:relative;overflow:hidden;background:#000}
  .wl .pane{aspect-ratio:96/171}
  .holy .pane{aspect-ratio:192/178.5}
  .pane iframe,.pane video{position:absolute;border:0;pointer-events:none}
  /* YouTube frame cropped to the area the vertical cut shows (measured earlier) */
  .wl .yt iframe{width:333.333%;height:105.263%;left:-116.667%;top:-2.924%}
  .holy .yt iframe{width:166.667%;height:100.840%;left:-33.333%;top:0}
  .wl .vv video{width:100%;height:100%;left:0;top:0;object-fit:fill}
  .holy .vv video{width:100%;height:190.476%;left:0;top:-45.238%;object-fit:fill}
  button{font:inherit;background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:8px 14px;margin-top:10px}
  p{margin:6px 0;color:#999}
</style>
</head>
<body>
<div class="wrap">
  <p>왼쪽 유튜브(보정 없음), 오른쪽 세로 영상. 같은 순간·같은 영역이 나옵니다. 재생 중에 스크린샷을 장면 바꿔가며 3~4장 찍어 보내주세요.</p>
  <button id="go">재생 시작</button>
  <h2>Wonderlust</h2>
  <div class="pair wl">
    <div class="col"><div class="pane yt"><div id="yt-wl"></div></div><div class="lab">유튜브 <span id="t-wl"></span></div></div>
    <div class="col"><div class="pane vv"><video id="v-wl" src="wl.mp4" muted playsinline preload="auto"></video></div><div class="lab">세로 영상</div></div>
  </div>
  <h2>Holy</h2>
  <div class="pair holy">
    <div class="col"><div class="pane yt"><div id="yt-holy"></div></div><div class="lab">유튜브 <span id="t-holy"></span></div></div>
    <div class="col"><div class="pane vv"><video id="v-holy" src="../holy-video/holy.mp4" muted playsinline preload="auto"></video></div><div class="lab">세로 영상</div></div>
  </div>
</div>
<script>
  // vertical time = YouTube time - off ; Wonderlust's vertical cut covers YouTube 2.85-69.2 s
  const S={wl:{id:'-WOT_QqtQ0M',off:2.85,start:4,end:68},holy:{id:'PzUdoQCf3lk',off:0.04,start:1,end:238}};
  const P={};
  window.onYouTubeIframeAPIReady=function(){
    for(const k in S){
      P[k]=new YT.Player('yt-'+k,{videoId:S[k].id,width:'100%',height:'100%',
        playerVars:{autoplay:1,mute:1,playsinline:1,controls:0,disablekb:1,rel:0,modestbranding:1,iv_load_policy:3,start:S[k].start},
        events:{onReady:e=>{e.target.mute();e.target.playVideo();}}});
    }
  };
  const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t);
  function go(){for(const k in S){const v=document.getElementById('v-'+k);v.muted=true;const p=v.play();if(p)p.catch(()=>{});if(P[k]&&P[k].playVideo)P[k].playVideo();}}
  document.getElementById('go').onclick=go;
  // keep the vertical cut locked to the YouTube clock
  setInterval(()=>{
    for(const k in S){
      const pl=P[k],v=document.getElementById('v-'+k);if(!pl||!pl.getCurrentTime)continue;
      let yt=pl.getCurrentTime();
      if(yt>S[k].end){pl.seekTo(S[k].start,true);continue;}
      document.getElementById('t-'+k).textContent=yt.toFixed(2)+'s';
      const want=yt-S[k].off,d=v.currentTime-want,playing=pl.getPlayerState()===1;
      if(!playing){if(!v.paused)v.pause();if(Math.abs(d)>0.05)v.currentTime=want;continue;}
      if(v.paused){v.currentTime=want;const p=v.play();if(p)p.catch(()=>{});continue;}
      if(Math.abs(d)>0.4){v.currentTime=want;v.playbackRate=1;}
      else v.playbackRate=Math.abs(d)<0.03?1:(d>0?0.92:1.08);
    }
  },200);
</script>
</body>
</html>
